<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Huduku – Coming in 2026</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #020617;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #e5e7eb;
    }
    .card {
      padding: 2.5rem 2rem;
      border-radius: 1rem;
      background: #020617;
      border: 1px solid #1e293b;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 40px rgba(15,23,42,0.8);
    }
    h1 { font-size: 1.5rem; margin-bottom: 0.5rem; }
    p { font-size: 0.95rem; color: #9ca3af; margin-bottom: 1.5rem; }
    .search {
      display: flex;
      gap: 0.5rem;
    }
    .search input {
      flex: 1;
      padding: 0.75rem 0.9rem;
      border-radius: 9999px;
      border: 1px solid #1f2937;
      background: #020617;
      color: #e5e7eb;
      outline: none;
    }
    .search button {
      padding: 0.75rem 1.2rem;
      border-radius: 9999px;
      border: none;
      background: #22c55e;
      color: #020617;
      font-weight: 600;
      cursor: pointer;
    }
    .search button:active { transform: scale(0.97); }
    small { display: block; margin-top: 0.75rem; color: #6b7280; font-size: 0.8rem; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Huduku</h1>
    <p>Happy New Year – we are going live soon in 2026!</p>
    <form class="search" onsubmit="event.preventDefault();">
      <input type="text" placeholder="Search will live here soon…" />
      <button type="submit">Search</button>
    </form>
    <small>huduku.app · Karnataka’s AI-enabled local search</small>
  </div>
</body>
</html>
